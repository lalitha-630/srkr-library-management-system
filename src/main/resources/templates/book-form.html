<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Book | SRKR Library Management System"></title>

        <style>
        * {
        box-sizing: border-box;
        }

        body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #252525;
        }

        header {
        padding: 20px 32px;
        background: #fff;
        border-bottom: 4px solid #f47b20;
        }

        header h1 {
        margin: 0;
        color: #b94e0b;
        }

        nav {
        padding: 16px 32px;
        background: #f47b20;
        }

        nav a {
        color: white;
        font-weight: bold;
        text-decoration: none;
        }

        main {
        max-width: 650px;
        margin: 32px auto;
        padding: 28px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px #00000012;
        }

        label {
        display: block;
        margin-top: 16px;
        font-weight: bold;
        }

        input {
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        }

        button {
        margin-top: 24px;
        padding: 12px 20px;
        border: 0;
        border-radius: 4px;
        background: #f47b20;
        color: white;
        font-weight: bold;
        cursor: pointer;
        }

        .cancel-link {
        margin-left: 12px;
        color: #555;
        text-decoration: none;
        }
        </style>
        </head>

        <body>
        <header>
        <h1>SRKR Library Management System</h1>
        </header>

        <nav>
        <a href="/books">Back to Books</a>
        </nav>

        <main>
        <h2 th:text="${book.id == null ? 'Add a Book' : 'Edit Book'}">
        Add a Book
        </h2>

        <form th:action="@{/books}" th:object="${book}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="title">Book Title</label>
        <input id="title" type="text" th:field="*{title}" required>

        <label for="author">Author</label>
        <input id="author" type="text" th:field="*{author}" required>

        <label for="category">Category</label>
        <input id="category" type="text" th:field="*{category}" required>

        <label for="totalCopies">Total Copies</label>
        <input id="totalCopies" type="number" min="1"
        th:field="*{totalCopies}" required>

        <button type="submit"
        th:text="${book.id == null ? 'Save Book' : 'Update Book'}">
        Save Book
        </button>

        <a class="cancel-link" href="/books">Cancel</a>
        </form>
        </main>
        </body>
        </html>
